
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A comprehensive UPSC Civil Services General Studies Paper I knowledge system covering Indian and world history, geography, art and culture, and Indian society."
  >

  <meta name="theme-color" content="#102844">

  <title>UPSC GS-I Knowledge System</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="js/navigation.js" defer></script>
</head>

<body>

  <!-- Primary site header -->
  <header data-site-header></header>

  <!-- Breadcrumb navigation -->
  <nav
    data-breadcrumbs
    aria-label="Breadcrumb"
  ></nav>

  <!-- Home page content -->
  <main class="page-layout">

    <section class="content-container">

      <h1 class="page-title" data-page-title>
        UPSC General Studies Paper I
      </h1>

      <p data-home-intro>
        A structured knowledge system for General Studies Paper I,
        covering Indian and world history, geography, art and culture,
        and Indian society.
      </p>

      <section aria-labelledby="module-directory-heading">

        <h2
          class="section-title"
          id="module-directory-heading"
        >
          GS-I Modules
        </h2>

        <p class="muted">
          Explore the modules below to access their chapters and
          subject-wise study material.
        </p>

        <div
          data-module-directory
          aria-live="polite"
        >
          <p class="muted">
            Loading modules...
          </p>
        </div>

      </section>

    </section>

  </main>

  <!-- Site footer -->
  <footer data-site-footer></footer>

</body>
</html>
